[platformio]
default_envs = esp32-s3
lib_dir = .
src_dir = examples/Master
; src_dir = examples/MasterCallbacks
; src_dir = examples/MasterAsync
; src_dir = examples/Slave
; src_dir = examples/TransparentProxy
; src_dir = examples/MasterHeap
; src_dir = examples/ReadAll
; src_dir = examples/TestAllIDs

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
lib_deps =
build_flags =
  -Wall
  -Wextra
upload_protocol = esptool
monitor_speed = 115200

[env:esp32-s3]
board = lolin_s3_mini
board_upload.after_reset = watchdog-reset
build_flags =
  ${env.build_flags}
  -D MASTER_RX_GPIO=35
  -D MASTER_TX_GPIO=36
  -D ARDUINO_USB_MODE=1

[env:esp32-s2]
board = lolin_s2_mini

[env:esp32-c3]
board = lolin_c3_mini

[env:esp32]
board = nodemcu-32s

[env:esp32-c6]
board = esp32-c6-devkitc-1

; CI can select any supported board without changing this file.
[env:ci]
board = ${sysenv.PIO_BOARD}
